name: T6 - no_gh (global history removed, 57 inputs / 3648 B)

# WHY THIS EXISTS
# The 2026-10-09 runtime ablation (TM_ABLATE=G) showed the 24 global-history input
# bits carry almost nothing, but a runtime ablation cannot answer the area question:
# zeroing inputs at run time still costs 5184 B.  This arm physically removes the
# group: NUM_INPUTS 81 -> 57, TM_G_HIST_BITS 24 -> 0, everything else identical
# (32 clauses, THRESHOLD 6, S 5, NUM_STATES 100, the 4 local-history bits and the
# 32 path bits untouched).  Area = 32 * 57 * 2 = 3648 B, i.e. -1536 B (-29.6%).
#
# Measured on ku before this run (sample_int / sample_fp):
#   TM MPKI 4.72575 -> 4.69267 (-0.70%), 3.26237 -> 3.05791 (-6.27%)
#   size 5184 -> 3648 bytes; GShare / instructions unchanged.
#
# T6 only (6 traces).  Decision rule from the PM: if T6 degrades by no more than
# 3% versus the 11.78138 baseline, the full set follows; if it is worse than that,
# the result stands as "area -29.6% at a cost of X%".

on:
  push:
    branches: [main]
    paths:
      - 't6_no_gh.json'
      - 'variants/no_gh/**'
      - '.github/workflows/t6_no_gh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t6-no-gh
  cancel-in-progress: false

jobs:
  gate:
    name: build + smoke gate (ku values frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils

      - name: gate 1 - pristine tree still reproduces the A baseline
        run: |
          set -euo pipefail
          grep -qE '^#define NUM_INPUTS 81' tm.h
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g_int.txt
          grep -qF "TM MPKI: 4.72575" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          grep -qF "TM right: 124142" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          echo "GATE 1 PASSED"

      - name: gate 2 - no_gh reproduces its ku smoke values and its 3648 B size
        run: |
          set -euo pipefail
          cp variants/no_gh/tm.h tm.h
          grep -E '^#define (NUM_INPUTS|NUM_CLAUSES|THRESHOLD|TM_G_HIST_BITS|TM_LOCAL_BITS|TM_PATH_BRANCHES)' tm.h
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g2a.txt
          ./cbp -E 1000000 sample_traces/fp/sample_fp_trace.gz  | tee g2b.txt
          fail=0
          ck(){ if grep -qF "$3" "$1"; then echo "  OK   $2"; else echo "  FAIL $2"; fail=1; fi; }
          ck g2a.txt int-size    "TM initialised with size 3648 bytes"
          ck g2a.txt int-mpki    "TM MPKI: 4.69267"
          ck g2a.txt int-right   "TM right: 124175"
          ck g2a.txt int-gshare  "GShare MPKI: 3.83635"
          ck g2a.txt int-instr   "Measured # of instructions: 997301"
          ck g2b.txt fp-mpki     "TM MPKI: 3.05791"
          ck g2b.txt fp-right    "TM right: 108189"
          ck g2b.txt fp-gshare   "GShare MPKI: 13.5907"
          ck g2b.txt fp-instr    "Measured # of instructions: 997741"
          if [ "$fail" -ne 0 ]; then echo "::error::NO_GH SMOKE GATE FAILED"; exit 1; fi
          echo "GATE 2 PASSED - no_gh is bit-identical to the ku build and costs 3648 B"

  t6:
    name: shard ${{ matrix.shard }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: runner specs
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          free -g | head -2
          df -h . | tail -2
      - name: install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev xz-utils
      - name: run T6 shard
        run: |
          set -uo pipefail
          python3 scripts/run_onebit_t6.py \
            --shard "${{ matrix.shard }}" --plan t6_no_gh.json --parallel 1 \
            --out-dir no_gh_results --logs-dir logs
      - name: upload results and raw stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nogh-${{ matrix.shard }}
          path: |
            no_gh_results/
            logs/
          retention-days: 14
          if-no-files-found: warn

  collect:
    name: collect + rebuild + gate + commit
    needs: t6
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'nogh-*'
          merge-multiple: true
          path: collected

      - name: assemble + pack raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p no_gh_results/logs
          cp collected/no_gh_results/shard-*.csv no_gh_results/
          ls -la no_gh_results/
          python3 scripts/pack_logs.py --src collected/logs --out no_gh_results/logs \
            --expect 6 --expect-csv 'no_gh_results/shard-*.csv'
          find no_gh_results/logs -name '*.log.gz' | wc -l

      - name: rebuild CSV from raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/rebuild_onebit_csv.py --results no_gh_results --plan t6_no_gh.json
          cat no_gh_results/ALL.csv

      - name: summarise (mean vs the T6 baseline 11.78138) + determinism gate
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/summarize_fullset_arm.py --arm no_gh --results no_gh_results \
            --base baseA_results/ALL.csv --plan fullsets_isoB.json --expect-traces 6
          cat no_gh_results/SUMMARY.md

      - name: commit and push (skip ci)
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "gha-sweep-bot"
          git config user.email "gha-sweep-bot@users.noreply.github.com"
          git add -f no_gh_results/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "T6 no_gh: 57 inputs / 3648 B x 6 traces + raw stdout [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          echo "::error::could not push"; exit 1

      - name: verdict - red only when incomplete, data is already pushed
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f no_gh_results/INVENTORY.txt ]; then
            echo "::error::no INVENTORY - collect did not produce a table"; exit 1
          fi
          cat no_gh_results/INVENTORY.txt
          grep -q '^VERDICT: COMPLETE$' no_gh_results/INVENTORY.txt \
            || { echo "::error::no_gh T6 INCOMPLETE (data committed anyway)"; exit 1; }
          echo "COLLECT COMPLETE"
