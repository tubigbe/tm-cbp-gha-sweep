name: TM full-set sweep

# Full 105-trace sweep x two FPTM configurations.
# 7 shards (one workload category each; int split in two so the runner disk stays comfortable).
# Each shard STREAMS its category tarball straight from Google Drive into tar -- the archive is
# never written to disk, and no pip/gdown is involved (Ubuntu 24.04 python is externally managed,
# so `pip install gdown` is rejected by PEP 668).
# Results are committed back by the collect job; `git pull` on ku is enough to fetch them.

on:
  push:
    branches: [main]
    paths:
      - 'fullsets.json'
      - 'scripts/run_fullset_shard.py'
      - '.github/workflows/fullset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: build + determinism gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils
      - name: build pristine source
        run: make clean && make -j"$(nproc)"
      - name: determinism gate (must equal AGENTS.md 10.3)
        run: |
          set -uo pipefail
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee s1.txt
          ./cbp -E 1000000 sample_traces/fp/sample_fp_trace.gz  | tee s2.txt
          fail=0
          ck(){ if grep -qF "$3" "$1"; then echo "  OK   $2"; else echo "  FAIL $2"; fail=1; fi; }
          ck s1.txt int-right "TM right: 124142"
          ck s1.txt int-mpki  "TM MPKI: 4.72575"
          ck s2.txt fp-right  "TM right: 107985"
          ck s2.txt fp-mpki   "TM MPKI: 3.26237"
          if [ "$fail" -ne 0 ]; then echo "::error::GATE FAILED"; exit 1; fi
          echo "GATE PASSED - bit-identical to the ku baseline"

  fullset:
    name: shard ${{ matrix.shard }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: runner specs
        run: |
          echo "cpu = $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          nproc
          free -g | head -2
          df -h . | tail -2

      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils

      - name: show this shard's plan
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("fullsets.json"))["${{ matrix.shard }}"]
          print("category :", p["category"])
          print("traces   :", len(p["traces"]))
          print("gdrive   :", p["gdrive_id"], "~%.2f GB" % p["size_gb"])
          print(", ".join(p["traces"]))
          PY

      - name: run full-set shard (download + both configs)
        run: |
          set -uo pipefail
          python3 scripts/run_fullset_shard.py \
            --shard "${{ matrix.shard }}" \
            --parallel 4 \
            --traces-dir traces \
            --logs-dir logs \
            --out-dir fullset_results

      - name: upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.shard }}
          path: |
            fullset_results/
            logs/
          retention-days: 14

  collect:
    name: collect + commit results
    needs: fullset
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          merge-multiple: true
          path: collected

      - name: assemble
        run: |
          set -euo pipefail
          mkdir -p fullset_results
          find collected -name '*.csv' -exec cp {} fullset_results/ \;
          ls -la fullset_results/
          cat fullset_results/shard-*.csv > fullset_results/ALL.csv || true
          wc -l fullset_results/ALL.csv || true

      - name: pack per-trace raw stdout (must come back with the CSV)
        run: |
          set -euo pipefail
          python3 scripts/pack_logs.py --src collected --out fullset_results/logs --expect-csv 'fullset_results/shard-*.csv'
          ls -la fullset_results/logs/ | head -5

      - name: commit and push (skip ci to avoid re-triggering)
        run: |
          set -euo pipefail
          git config user.name  "gha-sweep-bot"
          git config user.email "gha-sweep-bot@users.noreply.github.com"
          git add -f fullset_results/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fullset results: two FPTM configs x 105 traces [skip ci]"
          git push
