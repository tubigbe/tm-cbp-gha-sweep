name: TM full-set sweep (both FPTM configs, 105 traces)

# 全集 105 条 trace × 两个 FPTM 配置。7 个分片（每类一个，int 拆两半）。
# 每个分片自己从 Google Drive 拉它那一类的 tar.xz（共 7 次下载，不走仓库）。
# 结果由 collect 作业提交回仓库，ku 侧 git pull 即可拿到。

on:
  push:
    branches: [main]
    paths: ['fullsets.json', 'scripts/run_fullset_shard.py', '.github/workflows/fullset.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: build + determinism gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev
      - run: make clean && make -j"$(nproc)"
      - name: determinism gate (must equal AGENTS.md 10.3)
        run: |
          set -uo pipefail
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee s1.txt
          ./cbp -E 1000000 sample_traces/fp/sample_fp_trace.gz  | tee s2.txt
          fail=0
          ck(){ grep -qF "$3" "$1" && echo "  OK $2" || { echo "  FAIL $2"; fail=1; }; }
          ck s1.txt int-right "TM right: 124142"
          ck s1.txt int-mpki  "TM MPKI: 4.72575"
          ck s2.txt fp-right  "TM right: 107985"
          ck s2.txt fp-mpki   "TM MPKI: 3.26237"
          [ $fail -eq 0 ] && echo "GATE PASSED" || { echo "::error::GATE FAILED"; exit 1; }

  fullset:
    name: shard ${{ matrix.shard }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0,1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
      - name: runner specs
        run: |
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          nproc; free -g | head -2; df -h . | tail -2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils
      - name: show plan for this shard
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("fullsets.json"))["${{ matrix.shard }}"]
          print("category:", p["category"], "| traces:", len(p["traces"]),
                "| gdrive:", p["gdrive_id"], "| ~%.2f GB" % p["size_gb"])
          print(", ".join(p["traces"]))
          PY
      - name: run full-set shard
        run: |
          set -uo pipefail
          python3 scripts/run_fullset_shard.py \
            --shard "${{ matrix.shard }}" --parallel 4 \
            --traces-dir traces --logs-dir logs --out-dir results
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.shard }}
          path: |
            results/
            logs/
          retention-days: 14

  collect:
    name: collect + commit results
    needs: fullset
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          merge-multiple: true
          path: collected
      - name: assemble
        run: |
          set -euo pipefail
          mkdir -p fullset_results
          find collected -name '*.csv' -exec cp {} fullset_results/ \;
          ls -la fullset_results/
          cat fullset_results/*.csv > fullset_results/ALL.csv
          wc -l fullset_results/ALL.csv
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name  "gha-sweep-bot"
          git config user.email "gha-sweep-bot@users.noreply.github.com"
          git add -f fullset_results/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "fullset results: both FPTM configs on 105 traces [skip ci]"
          git push
