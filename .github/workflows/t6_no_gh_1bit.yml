name: T6 - no_gh + 1-bit (58 inputs / 3712 B)

# WHY THIS EXISTS
# Two results so far:
#   no_gh       57 inputs / 3648 B, full set 13.36670 vs 13.41542 (-0.36%)  -> free area
#   hybB        82 inputs / 5248 B, full set 11.68955 vs 13.41542 (-12.86%) -> the 1-bit bit
# Do the two effects stack?  This arm is no_gh's tm.h (no global history) with the
# 1-bit prediction appended as the 58th input bit: 21 PC + 0 gh + 4 local + 32 path
# + 1 onebit = 58 inputs -> 32*58*2 = 3712 B (TM side -28.4% vs 5184 B).
# NOTE the 16 KB 1-bit table is still there; the area claim must keep the two sides
# separate.
#
# Frozen success line (PM, 2026-11-02): T6 mean <= 10.6 -> full set; otherwise the
# conclusion is "the two effects do not stack" and no full-set run is bought.
#
# Smoke values below are from the muuhaha WSL build (2026-11-02), which is the
# source of truth since ku was archived:
#   sample_int TM/HYB 2.12875 / 126732, override 1026 / rescue 554 / hurt 472
#   sample_fp  TM/HYB 3.36861 / 107879, override 1539 / rescue 688 / hurt 851
#   size 3712 bytes, GShare and instructions unchanged.

on:
  push:
    branches: [main]
    paths:
      - 't6_no_gh_1bit.json'
      - 'variants/no_gh_1bit/**'
      - '.github/workflows/t6_no_gh_1bit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t6-no-gh-1bit
  cancel-in-progress: false

jobs:
  gate:
    name: build + smoke gate (muuhaha WSL values frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils

      - name: gate 1 - pristine tree still reproduces the A baseline
        run: |
          set -euo pipefail
          grep -qE '^#define NUM_INPUTS 81' tm.h
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g_int.txt
          grep -qF "TM MPKI: 4.72575" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          grep -qF "TM right: 124142" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          echo "GATE 1 PASSED"

      - name: gate 2 - no_gh_1bit reproduces the WSL smoke values and its 3712 B size
        run: |
          set -euo pipefail
          cp variants/no_gh_1bit/tm.h tm.h
          cp variants/no_gh_1bit/tm_predictor.h variants/no_gh_1bit/tm_predictor.cc \
             variants/no_gh_1bit/cond_branch_predictor_interface.cc .
          grep -E '^#define (NUM_INPUTS|TM_G_HIST_BITS|TM_ONEBIT_INPUT|TM_MODE|ONEBIT_INDEX_BITS)' tm.h
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g2a.txt
          ./cbp -E 1000000 sample_traces/fp/sample_fp_trace.gz  | tee g2b.txt
          fail=0
          ck(){ if grep -qF "$3" "$1"; then echo "  OK   $2"; else echo "  FAIL $2"; fail=1; fi; }
          ck g2a.txt int-size   "TM initialised with size 3712 bytes"
          ck g2a.txt int-mpki   "TM MPKI: 2.12875"
          ck g2a.txt int-right  "TM right: 126732"
          ck g2a.txt int-ovr    "override count: 1026"
          ck g2a.txt int-rescue "rescue: 554"
          ck g2a.txt int-hurt   "hurt: 472"
          ck g2a.txt int-gshare "GShare MPKI: 3.83635"
          ck g2a.txt int-instr  "Measured # of instructions: 997301"
          ck g2b.txt fp-mpki    "TM MPKI: 3.36861"
          ck g2b.txt fp-right   "TM right: 107879"
          ck g2b.txt fp-ovr     "override count: 1539"
          ck g2b.txt fp-gshare  "GShare MPKI: 13.5907"
          ck g2b.txt fp-instr   "Measured # of instructions: 997741"
          if [ "$fail" -ne 0 ]; then echo "::error::COMBO SMOKE GATE FAILED"; exit 1; fi
          echo "GATE 2 PASSED"

  t6:
    name: shard ${{ matrix.shard }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: runner specs
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          free -g | head -2
          df -h . | tail -2
      - name: install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev xz-utils
      - name: run T6 shard
        run: |
          set -uo pipefail
          python3 scripts/run_onebit_t6.py \
            --shard "${{ matrix.shard }}" --plan t6_no_gh_1bit.json --parallel 1 \
            --out-dir combo_results --logs-dir logs
      - name: upload results and raw stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-${{ matrix.shard }}
          path: |
            combo_results/
            logs/
          retention-days: 14
          if-no-files-found: warn

  collect:
    name: collect + rebuild + gate + commit
    needs: t6
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'combo-*'
          merge-multiple: true
          path: collected

      - name: assemble + pack raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p combo_results/logs
          cp collected/combo_results/shard-*.csv combo_results/
          ls -la combo_results/
          python3 scripts/pack_logs.py --src collected/logs --out combo_results/logs \
            --expect 6 --expect-csv 'combo_results/shard-*.csv'
          find combo_results/logs -name '*.log.gz' | wc -l

      - name: rebuild CSV from raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/rebuild_onebit_csv.py --results combo_results --plan t6_no_gh_1bit.json
          cat combo_results/ALL.csv

      - name: summarise (T6 mean vs the 11.78138 baseline) + determinism gate
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/summarize_fullset_arm.py --arm no_gh_1bit --results combo_results \
            --base baseA_results/ALL.csv --plan fullsets_isoB.json --expect-traces 6
          cat combo_results/SUMMARY.md

      - name: commit and push (skip ci)
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "gha-sweep-bot"
          git config user.email "gha-sweep-bot@users.noreply.github.com"
          git add -f combo_results/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "T6 no_gh+1bit: 58 inputs / 3712 B x 6 traces + raw stdout [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          echo "::error::could not push"; exit 1

      - name: verdict - red only when incomplete, data is already pushed
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f combo_results/INVENTORY.txt ]; then
            echo "::error::no INVENTORY"; exit 1
          fi
          cat combo_results/INVENTORY.txt
          grep -q '^VERDICT: COMPLETE$' combo_results/INVENTORY.txt \
            || { echo "::error::combo T6 INCOMPLETE (data committed anyway)"; exit 1; }
          echo "COLLECT COMPLETE"
