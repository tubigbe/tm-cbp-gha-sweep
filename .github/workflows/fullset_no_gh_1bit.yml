name: full set - no_gh + 1-bit (58 inputs / 3712 B, 105 traces)

# WHY THIS EXISTS
# The T6 run (41525304276, commit 8378587) passed the frozen bar: 10.53937 mean
# versus the 11.781382 baseline (-10.54%), 0.24% better than hybB while the TM is
# 28.4% smaller (3712 B vs 5184 B).  The frozen rule says a T6 mean <= 10.6 buys
# the full set, so this runs the same arm over the 7-shard / 105-trace plan.
#
# Area note that must survive into any write-up: the TM side is smaller, but the
# arm still carries the 16 KB 1-bit table.  Two sides, separate lines.

on:
  push:
    branches: [main]
    paths:
      - 'fullset_no_gh_1bit.json'
      - '.github/workflows/fullset_no_gh_1bit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fullset-no-gh-1bit
  cancel-in-progress: false

jobs:
  gate:
    name: build + smoke gate (muuhaha WSL values frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev xz-utils

      - name: gate 1 - pristine tree still reproduces the A baseline
        run: |
          set -euo pipefail
          grep -qE '^#define NUM_INPUTS 81' tm.h
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g_int.txt
          grep -qF "TM MPKI: 4.72575" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          grep -qF "TM right: 124142" g_int.txt || { echo "::error::pristine broken"; exit 1; }
          echo "GATE 1 PASSED"

      - name: gate 2 - no_gh_1bit reproduces the WSL smoke values and its 3712 B size
        run: |
          set -euo pipefail
          cp variants/no_gh_1bit/tm.h tm.h
          cp variants/no_gh_1bit/tm_predictor.h variants/no_gh_1bit/tm_predictor.cc \
             variants/no_gh_1bit/cond_branch_predictor_interface.cc .
          make clean >/dev/null && make -j"$(nproc)" >/dev/null
          ./cbp -E 1000000 sample_traces/int/sample_int_trace.gz | tee g2a.txt
          ./cbp -E 1000000 sample_traces/fp/sample_fp_trace.gz  | tee g2b.txt
          fail=0
          ck(){ if grep -qF "$3" "$1"; then echo "  OK   $2"; else echo "  FAIL $2"; fail=1; fi; }
          ck g2a.txt int-size   "TM initialised with size 3712 bytes"
          ck g2a.txt int-mpki   "TM MPKI: 2.12875"
          ck g2a.txt int-right  "TM right: 126732"
          ck g2a.txt int-ovr    "override count: 1026"
          ck g2a.txt int-rescue "rescue: 554"
          ck g2a.txt int-hurt   "hurt: 472"
          ck g2a.txt int-gshare "GShare MPKI: 3.83635"
          ck g2a.txt int-instr  "Measured # of instructions: 997301"
          ck g2b.txt fp-mpki    "TM MPKI: 3.36861"
          ck g2b.txt fp-right   "TM right: 107879"
          ck g2b.txt fp-gshare  "GShare MPKI: 13.5907"
          ck g2b.txt fp-instr   "Measured # of instructions: 997741"
          if [ "$fail" -ne 0 ]; then echo "::error::COMBO SMOKE GATE FAILED"; exit 1; fi
          echo "GATE 2 PASSED"

  fullset:
    name: shard ${{ matrix.shard }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: runner specs
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          free -g | head -2
          df -h . | tail -2
      - name: install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev xz-utils
      - name: show this shard's plan
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("fullsets_isoB.json"))["${{ matrix.shard }}"]
          print("category :", p["category"])
          print("traces   :", len(p["traces"]))
          print("gdrive   :", p["gdrive_id"], "~%.2f GB" % p["size_gb"])
          print(", ".join(p["traces"]))
          PY
      - name: run full-set shard
        run: |
          set -uo pipefail
          python3 scripts/run_fullset_arm.py \
            --shard "${{ matrix.shard }}" \
            --config no_gh_1bit \
            --plan fullsets_isoB.json \
            --parallel 4 \
            --traces-dir traces \
            --logs-dir combo_fullset/logs \
            --out-dir combo_fullset
      - name: upload results and raw stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fscb-${{ matrix.shard }}
          path: combo_fullset/
          retention-days: 14
          if-no-files-found: warn

  collect:
    name: collect + rebuild + determinism gate + commit
    needs: fullset
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'fscb-*'
          merge-multiple: true
          path: collected

      - name: assemble + pack raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p combo_fullset/logs
          cp collected/shard-*.csv combo_fullset/
          ls -la combo_fullset/
          python3 scripts/pack_logs.py --src collected --out combo_fullset/logs \
            --expect 105 --expect-csv 'combo_fullset/shard-*.csv'
          find combo_fullset/logs -name '*.log.gz' | wc -l
          du -sh combo_fullset/logs

      - name: rebuild CSV from raw stdout
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/rebuild_onebit_csv.py --results combo_fullset --plan fullset_no_gh_1bit.json
          wc -l combo_fullset/ALL.csv

      - name: summarise + determinism gate vs the 105-trace baseline
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/summarize_fullset_arm.py --arm no_gh_1bit --results combo_fullset \
            --base baseA_results/ALL.csv --plan fullsets_isoB.json --expect-traces 105
          cat combo_fullset/SUMMARY.md

      - name: commit and push (skip ci)
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "gha-sweep-bot"
          git config user.email "gha-sweep-bot@users.noreply.github.com"
          git add -f combo_fullset/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "full set no_gh+1bit: 58 inputs / 3712 B x 105 traces + raw stdout [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash || true
            sleep $((i * 5))
          done
          echo "::error::could not push"; exit 1

      - name: verdict - red only when incomplete, data is already pushed
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f combo_fullset/INVENTORY.txt ]; then
            echo "::error::no INVENTORY"; exit 1
          fi
          cat combo_fullset/INVENTORY.txt
          grep -q '^VERDICT: COMPLETE$' combo_fullset/INVENTORY.txt \
            || { echo "::error::combo full set INCOMPLETE (data committed anyway)"; exit 1; }
          echo "COLLECT COMPLETE"
